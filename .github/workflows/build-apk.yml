name: Build Android APK (ASAM)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm install --legacy-peer-deps

      - name: 🏗️ Build Web Assets
        run: npm run build

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 📱 Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: 🔄 Sync Capacitor Android
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: 🔑 Make Gradlew Executable
        run: chmod +x android/gradlew

      - name: ⚙️ Build Debug APK with Gradle
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: 📋 Prepare APK File
        run: |
          mkdir -p release-apk
          find android/app/build/outputs/apk/ -name "*.apk" -exec cp {} release-apk/ASAM-debug.apk \;

      - name: 🚀 Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ASAM-Android-APK
          path: release-apk/ASAM-debug.apk
          retention-days: 30
